name: Validate submissions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate submissions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted base tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out proposed data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: submission
          persist-credentials: false
          sparse-checkout: mods
      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Validate proposed packages with trusted tooling
        run: python trusted/tooling/validate.py --source submission --previous trusted --output prepared
      - name: Verify trusted publication rules without uploading
        run: python -m unittest discover -s trusted/tooling -p 'test_*.py'
