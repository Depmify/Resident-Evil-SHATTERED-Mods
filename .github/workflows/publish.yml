name: Publish approved mods

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-mod-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Depmify/Resident-Evil-SHATTERED-Mods'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out approved source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out previous approved source
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.before }}
          path: previous
          persist-credentials: false
          sparse-checkout: mods
      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare exact approved packages and catalog
        shell: bash
        run: |
          if [ -d previous/mods ]; then
            python tooling/validate.py --source . --previous previous --output prepared
          else
            python tooling/validate.py --source . --output prepared
          fi
      - name: Verify publication rules without uploading
        run: python -m unittest discover -s tooling -p 'test_*.py'
      - name: Preserve validated publication bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-mod-publication
          path: prepared/
          retention-days: 2
          if-no-files-found: error

  releases:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Retrieve this workflow's approved packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: approved-mod-publication
          path: prepared
      - name: Upload and verify immutable official Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tooling/publish.py --prepared prepared
      - name: Upload Pages only after official assets exist
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: prepared/site

  pages:
    needs: releases
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved catalog
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
